publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ludo_rules:
    path: ../../packages/ludo_rules
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  nearby_connections: ^4.1.0
  web_socket_channel: ^3.0.1
  record: ^5.1.2
  just_audio: ^0.9.40
  http: ^1.2.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
