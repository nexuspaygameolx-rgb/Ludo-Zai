services:
  - type: web
    name: ludo-zai-backend
    runtime: node
    plan: free
    rootDir: backend_render
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CASHMAAL_MERCHANT_ID
        sync: false
      - key: CASHMAAL_SECRET_PIN
        sync: false
      - key: CASHMAAL_PAYOUT_API_KEY
        sync: false
      - key: CASHMAAL_CHECKOUT_BASE_URL
        sync: false
      - key: CASHMAAL_PAYOUT_API_URL
        sync: false

  - type: web
    name: ludo-zai-admin
    runtime: static
    rootDir: apps/admin_web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
